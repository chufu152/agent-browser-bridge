<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Browser Agent</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1e1f22;
        color: #e6e6e6;
        font-size: 14px;
      }
      .header {
        padding: 16px;
        border-bottom: 1px solid #333;
        font-weight: 600;
        font-size: 15px;
      }
      .body {
        padding: 16px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4ade80;
      }
      .dot.off {
        background: #f87171;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #444;
        background: #2a2b30;
        color: #e6e6e6;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 8px;
      }
      button:hover {
        background: #34353a;
      }
      .muted {
        color: #8a8a8a;
        font-size: 12px;
        line-height: 1.5;
      }
      .section-title {
        margin: 12px 0 6px;
        font-weight: 600;
        font-size: 13px;
        color: #c8c8c8;
      }
      .list {
        margin-bottom: 8px;
      }
      .item {
        border: 1px solid #444;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .item .row {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .item button {
        flex: 1;
        margin-bottom: 0;
        padding: 5px;
        font-size: 12px;
      }
      .approve { border-color: #2f9e5f !important; }
      .deny { border-color: #d64545 !important; }
    </style>
  </head>
  <body>
    <div class="header">Universal Browser Agent</div>
    <div class="body">
      <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">正在检查…</span>
      </div>
      <button id="test-snapshot">测试当前页快照</button>
      <button id="test-ping">测试注入连接</button>

      <div class="section-title">待确认操作</div>
      <div id="confirmations" class="list muted">点击“刷新”加载</div>
      <button id="refresh-confirmations">刷新待确认</button>

      <div class="section-title">最近审计</div>
      <div id="audit" class="list muted">点击“刷新”加载</div>

      <pre class="muted" id="output" style="white-space: pre-wrap; word-break: break-all;"></pre>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
